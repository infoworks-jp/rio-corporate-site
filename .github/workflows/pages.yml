name: Deploy static site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy with verified artifact metadata
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            // REST lists the uploaded artifact reliably when the artifact-service
            // listing used by deploy-pages returns an empty result.
            const repo = context.repo;
            const result = await github.rest.actions.listWorkflowRunArtifacts({ ...repo, run_id: context.runId });
            const artifacts = result.data.artifacts.filter(a => a.name === 'github-pages' && !a.expired);
            if (artifacts.length !== 1) throw new Error('Expected one Pages artifact');
            const idToken = await core.getIDToken();
            const deployment = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: artifacts[0].id, pages_build_version: context.sha, oidc_token: idToken
            });
            core.setOutput('page_url', deployment.data.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const status = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: deployment.data.id
              });
              if (status.data.status === 'succeed') return;
              if (!['deployment_in_progress', 'queued', 'pending'].includes(status.data.status)) {
                throw new Error('Pages deployment status: ' + status.data.status);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out');
