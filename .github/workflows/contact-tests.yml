name: Contact form checks
on:
  push:
    paths: ['recruit-contact.js', 'supabase/**', 'tests/**', '.github/workflows/contact-tests.yml']
  pull_request:
    paths: ['recruit-contact.js', 'supabase/**', 'tests/**', '.github/workflows/contact-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check recruit-contact.js
      - run: node --test tests/contact.test.mjs
