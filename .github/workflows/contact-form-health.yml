name: Keep contact form available

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/rio-contact/**'
      - '.github/workflows/contact-form-health.yml'
  schedule:
    - cron: '23 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Edge Function and database
        env:
          ENDPOINT: https://xxhgerxugsjoxkbuuqhb.supabase.co/functions/v1/rio-contact
        run: |
          set -euo pipefail
          response="$(curl -fsS --retry 3 --retry-delay 10 --max-time 30 "$ENDPOINT")"
          printf '%s' "$response" | jq -e '.ok == true and .service == "rio-contact"' >/dev/null
          echo 'Recruitment contact endpoint and database are healthy.'
