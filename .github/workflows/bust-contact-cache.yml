name: Force latest contact form script
on:
  push:
    paths:
      - '.github/workflows/bust-contact-cache.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bust recruit-contact cache
        run: |
          sed -i 's/recruit-contact.js?v=20260809-1633/recruit-contact.js?v=20260809-1715/g' index.html
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Load server-side contact form'
            git push
          fi
